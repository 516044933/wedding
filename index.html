<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>婚礼倒计时</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"PingFang SC","Microsoft YaHei","SimSun",serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 180, 90, 0.45), transparent 26%),
    radial-gradient(circle at 70% 90%, rgba(255, 110, 40, 0.35), transparent 28%),
    linear-gradient(135deg,#e56a1e 0%,#d84b18 45%,#b53512 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  padding:30px;
  position:relative;
  overflow:hidden;
}

/* 暗纹底 */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04) 1px, transparent 1.2px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.035) 1px, transparent 1.4px);
  background-size:220px 220px, 180px 180px;
  pointer-events:none;
  opacity:.55;
}

/* 金色边框 */
.frame{
  position:relative;
  width:100%;
  max-width:1100px;
  padding:40px 50px;
  border:2px solid rgba(255,210,120,0.55);
  border-radius:18px;
  box-shadow:
    0 0 0 10px rgba(255,255,255,0.04),
    0 0 40px rgba(0,0,0,0.25),
    inset 0 0 60px rgba(255,140,60,0.12);
  background:
    linear-gradient(145deg, rgba(255,150,70,0.18), rgba(200,70,20,0.18));
}

/* 四角金线 */
.frame::before,
.frame::after{
  content:"";
  position:absolute;
  width:42px;
  height:42px;
  border-color:#ffd57a;
  border-style:solid;
  border-width:0;
}
.frame::before{
  top:10px;left:10px;
  border-top-width:2px;
  border-left-width:2px;
}
.frame::after{
  bottom:10px;right:10px;
  border-bottom-width:2px;
  border-right-width:2px;
}

/* 顶部双喜 */
.top-double-happiness{
  text-align:center;
  font-size:28px;
  color:#ffd57a;
  letter-spacing:8px;
  margin-bottom:8px;
  text-shadow:0 2px 10px rgba(0,0,0,0.25);
}

/* 顶部小装饰线 */
.top-sub{
  text-align:center;
  font-size:13px;
  letter-spacing:4px;
  color:#ffe2a8;
  opacity:.85;
  margin-bottom:18px;
}

/* 主标题 */
.main-title{
  text-align:center;
  font-size:54px;
  font-weight:bold;
  letter-spacing:10px;
  color:#fff;
  text-shadow:0 4px 18px rgba(0,0,0,0.35);
  margin-bottom:10px;
}

/* 副标题 */
.sub-title{
  text-align:center;
  font-size:15px;
  letter-spacing:6px;
  color:#ffe2a8;
  margin-bottom:34px;
  opacity:.9;
}

/* 倒计时卡片区 */
.count-wrap{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:30px;
}

.count-item{
  width:110px;
  height:130px;
  background:linear-gradient(180deg,#ffffff 0%,#f7f1e4 100%);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 10px 24px rgba(0,0,0,0.18),
    inset 0 0 0 1px rgba(255,255,255,0.6);
  position:relative;
}

.count-item::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(255,215,140,0.45);
  border-radius:10px;
  pointer-events:none;
}

.count-num{
  font-size:44px;
  font-weight:800;
  color:#b83412;
  line-height:1;
  font-family:"DIN","Arial",sans-serif;
  letter-spacing:2px;
}

.count-unit{
  margin-top:10px;
  font-size:14px;
  color:#8a2b10;
  letter-spacing:4px;
}

/* 中间文案 */
.mid-text{
  text-align:center;
  font-size:16px;
  color:#fff;
  letter-spacing:3px;
  margin-bottom:8px;
  opacity:.95;
}

.mid-date{
  text-align:center;
  font-size:14px;
  color:#ffe2a8;
  letter-spacing:2px;
  margin-bottom:24px;
  opacity:.85;
}

/* 底部英文 */
.footer-text{
  text-align:center;
  font-size:13px;
  letter-spacing:4px;
  color:#ffe2a8;
  opacity:.8;
}

/* 两侧花和猫装饰，不干扰居中内容 */
.deco-left,
.deco-right{
  position:absolute;
  bottom:20px;
  width:140px;
  height:140px;
  opacity:.85;
  pointer-events:none;
}
.deco-left{
  left:20px;
  background:radial-gradient(circle at center, rgba(255,255,255,0.18) 0%, transparent 70%);
  border-radius:50%;
}
.deco-right{
  right:20px;
  background:radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 70%);
  border-radius:50%;
}

/* 响应式 */
@media (max-width: 720px){
  .main-title{ font-size:34px; letter-spacing:6px; }
  .count-item{ width:82px; height:100px; }
  .count-num{ font-size:32px; }
  .count-unit{ font-size:12px; }
  .frame{ padding:28px 20px; }
  .deco-left,.deco-right{ width:90px; height:90px; }
}
</style>
</head>
<body>

<div class="frame">

  <div class="top-double-happiness">囍</div>
  <div class="top-sub">良 辰 将 至</div>

  <div class="main-title" id="mainTitle">婚礼倒计时</div>
  <div class="sub-title">一 生 一 世 · 一 心 一 意</div>

  <div class="count-wrap">
    <div class="count-item">
      <div class="count-num" id="day">00</div>
      <div class="count-unit">天</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="hour">00</div>
      <div class="count-unit">时</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="min">00</div>
      <div class="count-unit">分</div>
    </div>
    <div class="count-item">
      <div class="count-num" id="sec">00</div>
      <div class="count-unit">秒</div>
    </div>
  </div>

  <div class="mid-text" id="midText">所爱隔山海，山海皆可平</div>
  <div class="mid-date" id="midDate">良辰吉日 · 2027年1月1日 12:00</div>

  <div class="footer-text">WITH LOVE · FOREVER</div>

  <div class="deco-left"></div>
  <div class="deco-right"></div>
</div>

<script>
const weddingTime = new Date("2027-01-01 12:00:00").getTime();
const marryTime = new Date("2026-12-24 11:30:00").getTime();

function update(){
  const now = Date.now();
  const diffWedding = weddingTime - now;

  let day, hour, min, sec;

  if(diffWedding > 0){
    document.getElementById("mainTitle").innerText = "婚礼倒计时";
    document.getElementById("midText").innerText = "所爱隔山海，山海皆可平";
    document.getElementById("midDate").innerText = "良辰吉日 · 2027年1月1日 12:00";

    day = Math.floor(diffWedding / (1000 * 60 * 60 * 24));
    hour = Math.floor((diffWedding % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    min = Math.floor((diffWedding % (1000 * 60 * 60)) / (1000 * 60));
    sec = Math.floor((diffWedding % (1000 * 60)) / 1000);
  }else{
    document.getElementById("mainTitle").innerText = "其实";
    document.getElementById("midText").innerText = "领证已经";
    document.getElementById("midDate").innerText = "";

    const diffMarry = now - marryTime;
    day = Math.floor(diffMarry / (1000 * 60 * 60 * 24));
    hour = Math.floor((diffMarry % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    min = Math.floor((diffMarry % (1000 * 60 * 60)) / (1000 * 60));
    sec = Math.floor((diffMarry % (1000 * 60)) / 1000);
  }

  document.getElementById("day").innerText = String(day).padStart(2,"0");
  document.getElementById("hour").innerText = String(hour).padStart(2,"0");
  document.getElementById("min").innerText = String(min).padStart(2,"0");
  document.getElementById("sec").innerText = String(sec).padStart(2,"0");
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
