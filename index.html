<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我们的婚礼纪念</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, #b44c16 0%, #F37021 45%, #d4601b 100%);
    color: #f7e4c0;
  }

  /* 暗金边框 */
  body::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(246, 211, 155, 0.45);
    border-radius: 18px;
    pointer-events: none;
  }

  /* 四角金色装饰 */
  .corner {
    position: absolute;
    width: 90px;
    height: 90px;
    border-color: rgba(246, 211, 155, 0.55);
    border-style: solid;
    border-width: 0;
  }
  .corner.tl { top: 30px; left: 30px; border-top-width: 1px; border-left-width: 1px; }
  .corner.tr { top: 30px; right: 30px; border-top-width: 1px; border-right-width: 1px; }
  .corner.bl { bottom: 30px; left: 30px; border-bottom-width: 1px; border-left-width: 1px; }
  .corner.br { bottom: 30px; right: 30px; border-bottom-width: 1px; border-right-width: 1px; }

  /* 卡通装饰区：1只狗 + 2只猫 */
  .deco {
    position: absolute;
    font-size: 44px;
    opacity: 0.9;
    z-index: 2;
  }
  .deco .label {
    display: block;
    font-size: 14px;
    margin-top: 4px;
    color: #ffe9c7;
    letter-spacing: 2px;
  }
  .dog    { top: 40px;  left: 60px;  } /* 一只狗 */
  .cat1   { bottom: 40px; left: 60px;  } /* 两只猫 */
  .cat2   { bottom: 40px; right: 60px; }

  .peony {
    position: absolute;
    font-size: 30px;
    opacity: 0.75;
    z-index: 1;
  }
  .peony1 { top: 140px; left: 210px; }
  .peony2 { bottom: 140px; left: 210px; }
  .peony3 { top: 140px; right: 210px; }
  .peony4 { bottom: 140px; right: 210px; }

  /* 主内容 */
  .wrap {
    position: relative;
    z-index: 3;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 40px;
  }

  .top-text {
    font-size: 24px;
    letter-spacing: 14px;
    color: #ffe9c7;
    opacity: 0.9;
  }

  .title {
    font-size: 78px;
    font-weight: 800;
    letter-spacing: 10px;
    color: #fff4dc;
    text-shadow: 0 6px 30px rgba(120, 40, 10, 0.45);
  }

  .subtitle {
    font-size: 24px;
    letter-spacing: 4px;
    color: #ffe9c7;
    opacity: 0.88;
    margin-bottom: 12px;
  }

  /* 倒计时区域：婚礼前和婚后纪念共用同一套时间盒 */
  .time-row {
    display: flex;
    gap: 22px;
    margin: 24px 0 18px;
  }

  .time-block {
    width: 170px;
    height: 190px;
    background: rgba(140, 50, 14, 0.35);
    border: 1px solid rgba(246, 211, 155, 0.55);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    backdrop-filter: blur(6px);
  }

  .time-num {
    font-size: 76px;
    font-weight: 800;
    color: #fff4dc;
    letter-spacing: 4px;
  }

  .time-label {
    font-size: 22px;
    color: #ffe9c7;
    margin-top: 8px;
    letter-spacing: 6px;
  }

  .dot {
    width: 14px;
    height: 14px;
    background: #ffe9c7;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 0 12px rgba(255, 233, 199, 0.8);
  }
  .dot.left  { left: -7px; }
  .dot.right { right: -7px; }

  /* 纪念页区域 */
  .memorial {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .memorial .mem-title {
    font-size: 40px;
    letter-spacing: 10px;
    color: #ffe9c7;
  }

  .memorial .mem-text {
    font-size: 24px;
    color: #ffe9c7;
    opacity: 0.9;
    text-align: center;
    line-height: 1.9;
    letter-spacing: 2px;
  }

  .desc-line1, .desc-line2 {
    font-size: 26px;
    color: #fff4dc;
    letter-spacing: 4px;
    opacity: 0.92;
  }

  .footer-text {
    position: absolute;
    bottom: 24px;
    width: 100%;
    text-align: center;
    font-size: 18px;
    color: #ffe9c7;
    opacity: 0.75;
    letter-spacing: 3px;
    z-index: 3;
  }

  /* 响应式适配 */
  @media (max-width: 1200px) {
    .title { font-size: 56px; }
    .time-block { width: 140px; height: 160px; }
    .time-num { font-size: 60px; }
  }

  @media (max-width: 900px) {
    .title { font-size: 42px; }
    .time-row { gap: 12px; }
    .time-block { width: 100px; height: 120px; }
    .time-num { font-size: 42px; }
    .time-label { font-size: 16px; }
  }
</style>
</head>

<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- 卡通装饰：1只狗 + 2只猫 -->
  <div class="deco dog">
    🐶宾果
    <span class="label">BINGO</span>
  </div>
  <div class="deco cat1">
    🐱三花
    <span class="label">CALICO</span>
  </div>
  <div class="deco cat2">
    🐱狸白
    <span class="label">TABBY</span>
  </div>

  <div class="peony peony1">🌸牡丹</div>
  <div class="peony peony2">🌸牡丹</div>
  <div class="peony3">🌸牡丹</div>
  <div class="peony peony4">🌸牡丹</div>

  <div class="wrap">

    <!-- 倒计时页面 -->
    <div id="countdownPage">
      <div class="top-text">良 辰 将 至</div>
      <div class="title">婚 礼 倒 计 时</div>
      <div class="subtitle">一生一世 · 一心一意</div>

      <div class="time-row">
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="day">00</div>
          <div class="time-label">天</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="hour">00</div>
          <div class="time-label">时</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="min">00</div>
          <div class="time-label">分</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="sec">00</div>
          <div class="time-label">秒</div>
        </div>
      </div>

      <div class="desc-line1">所爱隔山海，山海皆可平</div>
      <div class="desc-line2">良辰吉日 · 2027年1月1日 12:00</div>
    </div>

    <!-- 领证纪念页面 -->
    <div id="memorialPage" class="memorial">
      <div class="top-text">我 们 的 纪 念</div>
      <div class="title">已 经 领 证</div>
      <div class="subtitle">从 2026 年 12 月 24 日 开 始</div>

      <div class="time-row">
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedDay">00</div>
          <div class="time-label">天</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedHour">00</div>
          <div class="time-label">时</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedMin">00</div>
          <div class="time-label">分</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedSec">00</div>
          <div class="time-label">秒</div>
        </div>
      </div>

      <div class="mem-text">
        2026年12月24日，我们领证<br>
        2027年1月1日，我们举行婚礼<br>
        余生请多指教
      </div>
    </div>

  </div>

  <div class="footer-text">WITH LOVE · FOREVER 囍</div>

<script>
  const weddingTime = new Date("2027-01-01 12:00:00").getTime();
  const marryCertTime = new Date("2026-12-24 00:00:00").getTime();

  function updatePage() {
    const now = Date.now();
    const diff = weddingTime - now;

    const countdownPage = document.getElementById("countdownPage");
    const memorialPage  = document.getElementById("memorialPage");

    if (diff > 0) {
      // 婚礼前：显示婚礼倒计时
      countdownPage.style.display = "block";
      memorialPage.style.display  = "none";

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("day").innerText = String(d).padStart(2, "0");
      document.getElementById("hour").innerText = String(h).padStart(2, "0");
      document.getElementById("min").innerText  = String(m).padStart(2, "0");
      document.getElementById("sec").innerText = String(s).padStart(2, "0");

    } else {
      // 婚礼结束后：切换为已经领证 天 时 分 秒
      countdownPage.style.display = "none";
      memorialPage.style.display  = "flex";

      const marriedMs = now - marryCertTime;

      const d = Math.floor(marriedMs / (1000 * 60 * 60 * 24));
      const h = Math.floor((marriedMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((marriedMs % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((marriedMs % (1000 * 60)) / 1000);

      document.getElementById("marriedDay").innerText = String(d).padStart(2, "0");
      document.getElementById("marriedHour").innerText = String(h).padStart(2, "0");
      document.getElementById("marriedMin").innerText  = String(m).padStart(2, "0");
      document.getElementById("marriedSec").innerText = String(s).padStart(2, "0");
    }
  }

  updatePage();
  setInterval(updatePage, 1000);
</script>

</body>
</html>
