    <!-- 倒计时页面 -->
    <div id="countdownPage">
      <div class="top-text">良 辰 将 至</div>
      <div class="title">开 席 倒 计 时</div>
      <div class="subtitle">一生一世 · 一心一意</div>

      <div class="time-row">
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="day">00</div>
          <div class="time-label">天</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="hour">00</div>
          <div class="time-label">时</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="min">00</div>
          <div class="time-label">分</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="sec">00</div>
          <div class="time-label">秒</div>
        </div>
      </div>

      <div class="desc-line1">所爱隔山海，山海皆可平</div>
      <div class="desc-line2">良辰吉日 · 2027年1月1日 12:00</div>
    </div>

    <!-- 领证纪念页面 -->
    <div id="memorialPage" class="memorial">
      <div class="top-text">我 们 的 纪 念</div>
      <div class="title">已 经 领 证</div>
      <div class="subtitle">从 2026 年 12 月 24 日 开 始</div>

      <div class="time-row">
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedDay">00</div>
          <div class="time-label">天</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedHour">00</div>
          <div class="time-label">时</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedMin">00</div>
          <div class="time-label">分</div>
        </div>
        <div class="time-block">
          <div class="dot left"></div>
          <div class="dot right"></div>
          <div class="time-num" id="marriedSec">00</div>
          <div class="time-label">秒</div>
        </div>
      </div>

      <div class="mem-text">
        2026年12月24日，我们领证<br>
        2027年1月1日，我们举行婚筵<br>
        余生请多指教
      </div>
    </div>

  </div>

  <div class="footer-text">WITH LOVE · FOREVER 囍</div>

<script>
  const weddingTime = new Date("2027-01-01 12:00:00").getTime();
  const marryCertTime = new Date("2026-12-24 00:00:00").getTime();

  function updatePage() {
    const now = Date.now();
    const diff = weddingTime - now;

    const countdownPage = document.getElementById("countdownPage");
    const memorialPage  = document.getElementById("memorialPage");

    if (diff > 0) {
      // 婚礼前：显示婚礼倒计时
      countdownPage.style.display = "block";
      memorialPage.style.display  = "none";

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("day").innerText = String(d).padStart(2, "0");
      document.getElementById("hour").innerText = String(h).padStart(2, "0");
      document.getElementById("min").innerText  = String(m).padStart(2, "0");
      document.getElementById("sec").innerText = String(s).padStart(2, "0");

    } else {
      // 婚礼结束后：切换为已经领证 天 时 分 秒
      countdownPage.style.display = "none";
      memorialPage.style.display  = "flex";

      const marriedMs = now - marryCertTime;

      const d = Math.floor(marriedMs / (1000 * 60 * 60 * 24));
      const h = Math.floor((marriedMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((marriedMs % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((marriedMs % (1000 * 60)) / 1000);

      document.getElementById("marriedDay").innerText = String(d).padStart(2, "0");
      document.getElementById("marriedHour").innerText = String(h).padStart(2, "0");
      document.getElementById("marriedMin").innerText  = String(m).padStart(2, "0");
      document.getElementById("marriedSec").innerText = String(s).padStart(2, "0");
    }
  }

  updatePage();
  setInterval(updatePage, 1000);
</script>

</body>
</html>
